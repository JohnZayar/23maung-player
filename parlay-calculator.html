<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>မောင်းတွက်စက် — 23မောင်း</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1f33; font-family: -apple-system, "Segoe UI", "Myanmar Text", "Pyidaungsu", sans-serif; color: #f3ead2; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 8px 12px 12px; }
  h1 { margin: 2px 0 8px; font-size: 20px; color: #d4af37; text-align: center; }
  h1 span { font-size: 12px; color: #9fb3c8; font-weight: 400; }
  .card { background: #1e3a5f; border: 1px solid #d4af37; border-radius: 10px; padding: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; margin-bottom: 3px; color: #f3ead2; }
  .field label small { color: #9fb3c8; font-size: 11px; }
  input[type="number"] { width: 100%; padding: 8px 10px; font-size: 16px; border-radius: 7px; border: 1px solid #3d5a80; background: #0f1f33; color: #fff; }
  input[type="number"]:focus { outline: 2px solid #d4af37; }
  .prar-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .prar-grid input { font-size: 15px; padding: 8px; }
  .addbtn { margin-top: 6px; background: transparent; color: #d4af37; border: 1px dashed #d4af37; border-radius: 7px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .commrow { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
  .commrow .field { flex: 1; margin-bottom: 0; }
  .clearbtn { background: #d4af37; color: #1e3a5f; border: none; border-radius: 7px; padding: 9px 16px; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .err { color: #ff8a80; font-size: 13px; margin: 0 0 8px; }
  .err:empty { display: none; }
  .result { background: #12263f; border: 1px solid #3d5a80; border-radius: 10px; padding: 10px 12px; }
  .rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
  .rgrid .line { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .rgrid .line span:last-child { font-weight: 700; }
  .total { display: flex; justify-content: space-between; font-size: 19px; padding: 7px 0 0; margin-top: 5px; border-top: 1px dashed #2c4a6b; color: #d4af37; font-weight: 800; }
  .total span:last-child { font-size: 21px; }
  .neg { color: #ff8a80; }
  .note { font-size: 11px; color: #9fb3c8; line-height: 1.45; margin: 8px 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>မောင်းတွက်စက် <span>23မောင်း</span></h1>

  <div class="card">
    <div class="grid2">
      <div class="field"><label>ပွဲအရေအတွက်</label><input id="legs" type="number" min="1" max="10" inputmode="numeric" placeholder="ဥပမာ 6"></div>
      <div class="field"><label>ငွေအမောက် (ကျပ်)</label><input id="stake" type="number" min="0" inputmode="numeric" placeholder="ဥပမာ 10000"></div>
      <div class="field"><label>အပြည့်အောင် <small>(ပွဲ)</small></label><input id="fullWin" type="number" min="0" inputmode="numeric" placeholder="ဥပမာ 3"></div>
      <div class="field"><label>အပြည့်ရှုံး <small>(ပွဲ — ၁ ပွဲရှုံးရင် မောင်းလုံး ၀)</small></label><input id="fullLoss" type="number" min="0" inputmode="numeric" value="0"></div>
    </div>

    <div class="field">
      <label>ပြားနိုင် <small>— ပြားတန်ဖိုး (%) တစ်ပွဲချင်း</small></label>
      <div class="prar-grid" id="prarWBox">
        <input class="prarW" type="number" min="0" max="99" inputmode="numeric" placeholder="ပြား% ၁">
        <input class="prarW" type="number" min="0" max="99" inputmode="numeric" placeholder="ပြား% ၂">
      </div>
      <button class="addbtn" id="addW" type="button">+ ပြားနိုင် ပွဲ ထပ်ထည့်</button>
    </div>

    <div class="field">
      <label>ပြားရှုံး <small>— ပြားတန်ဖိုး (%) တစ်ပွဲချင်း</small></label>
      <div class="prar-grid" id="prarLBox">
        <input class="prarL" type="number" min="0" max="99" inputmode="numeric" placeholder="ပြား% ၁">
        <input class="prarL" type="number" min="0" max="99" inputmode="numeric" placeholder="ပြား% ၂">
        <input class="prarL" type="number" min="0" max="99" inputmode="numeric" placeholder="ပြား% ၃">
      </div>
      <button class="addbtn" id="addL" type="button">+ ပြားရှုံး ပွဲ ထပ်ထည့်</button>
    </div>

    <div class="commrow">
      <div class="field"><label>ကော်မရှင် (%)</label><input id="comm" type="number" min="0" max="100" inputmode="decimal" value="16"></div>
      <button class="clearbtn" id="clear" type="button">ရှင်းမယ်</button>
    </div>

    <div class="err" id="err"></div>
    <div class="result">
      <div class="rgrid">
        <div class="line"><span>တွန်း (push)</span><span id="pushes">—</span></div>
        <div class="line"><span>မြှောက်ကိန်း</span><span id="mult">—</span></div>
        <div class="line"><span>အနိုင်</span><span id="profit">—</span></div>
        <div class="line"><span>အရင်း</span><span id="stakeOut">—</span></div>
      </div>
      <div class="total"><span>စုစုပေါင်း</span><span id="total">—</span></div>
    </div>
  </div>

  <p class="note">အနိုင် = ငွေ × (၂^အပြည့်အောင် × (၁+ပြား%) × (၁−ပြား%)) × (၁−ကော်မရှင်%) · စုစုပေါင်း = အနိုင် + အရင်း</p>
</div>

<script>
function num(id, def) {
  var v = parseFloat(document.getElementById(id).value);
  return isNaN(v) ? (def === undefined ? 0 : def) : v;
}
function prarVals(cls) {
  var out = [];
  var els = document.querySelectorAll('.' + cls);
  for (var i = 0; i < els.length; i++) {
    var v = parseFloat(els[i].value);
    if (!isNaN(v)) out.push(v);
  }
  return out;
}
function fmt(n) {
  return Math.round(n).toLocaleString('en-US');
}
function calc() {
  var err = document.getElementById('err');
  var N = num('legs'), stake = num('stake'), comm = num('comm', 16);
  var full = num('fullWin'), fullLoss = num('fullLoss');
  var wVals = prarVals('prarW'), lVals = prarVals('prarL');
  var pushes = N - full - wVals.length - lVals.length - fullLoss;
  err.textContent = '';
  if (N <= 0 || stake <= 0) {
    setOut('—', '—', '—', '—', '—');
    return;
  }
  if (pushes < 0) {
    err.textContent = 'ပွဲအရေအတွက် ထက် များနေတယ် — အပြည့်အောင် + ပြားနိုင် + ပြားရှုံး + အပြည့်ရှုံး ကို ပြန်စစ်ပါ။';
    setOut('—', '—', '—', '—', '—');
    return;
  }
  var mult = Math.pow(2, full);
  for (var i = 0; i < wVals.length; i++) mult *= (1 + wVals[i] / 100);
  for (var j = 0; j < lVals.length; j++) mult *= (1 - lVals[j] / 100);
  var profit, total;
  if (fullLoss > 0) {
    profit = -stake; total = 0;
  } else {
    profit = stake * mult * (1 - comm / 100);
    total = profit + stake;
  }
  setOut(pushes + ' ပွဲ', mult.toFixed(4), fmt(profit) + ' ကျပ်', fmt(stake) + ' ကျပ်', fmt(total) + ' ကျပ်');
  var tEl = document.getElementById('total');
  var pEl = document.getElementById('profit');
  tEl.className = total === 0 ? 'neg' : '';
  pEl.className = profit < 0 ? 'neg' : '';
}
function setOut(pushes, mult, profit, stakeOut, total) {
  document.getElementById('pushes').textContent = pushes;
  document.getElementById('mult').textContent = mult;
  document.getElementById('profit').textContent = profit;
  document.getElementById('stakeOut').textContent = stakeOut;
  document.getElementById('total').textContent = total;
}
function addField(boxId, cls, ph) {
  var box = document.getElementById(boxId);
  var inp = document.createElement('input');
  inp.type = 'number'; inp.min = '0'; inp.max = '99'; inp.inputMode = 'numeric';
  inp.className = cls; inp.placeholder = ph;
  inp.addEventListener('input', calc);
  box.appendChild(inp);
}
document.querySelectorAll('input').forEach(function (el) { el.addEventListener('input', calc); });
document.getElementById('addW').addEventListener('click', function () {
  var n = document.querySelectorAll('.prarW').length + 1;
  addField('prarWBox', 'prarW', 'ပြား% ' + n);
});
document.getElementById('addL').addEventListener('click', function () {
  var n = document.querySelectorAll('.prarL').length + 1;
  addField('prarLBox', 'prarL', 'ပြား% ' + n);
});
document.getElementById('clear').addEventListener('click', function () {
  document.querySelectorAll('input').forEach(function (el) {
    if (el.id === 'comm') el.value = '16';
    else if (el.id === 'fullLoss') el.value = '0';
    else el.value = '';
  });
  var wBox = document.getElementById('prarWBox');
  while (wBox.children.length > 2) wBox.removeChild(wBox.lastChild);
  var lBox = document.getElementById('prarLBox');
  while (lBox.children.length > 3) lBox.removeChild(lBox.lastChild);
  document.getElementById('err').textContent = '';
  setOut('—', '—', '—', '—', '—');
});
calc();
</script>
</body>
</html>
